<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Logo do Controlog, tema "branco sobre azul" do design da marca. O bloco
       sólido é o que garante contraste a 16px, independente de o navegador
       desenhar a aba clara ou escura. -->
  <rect width="120" height="120" rx="28" fill="#2563eb"/>
  <!-- Símbolo ampliado em torno do centro para ocupar bem o bloco. -->
  <g transform="translate(60 60) scale(1.22) translate(-60 -62)" fill="none">
    <path d="M88 30H60A30 30 0 0 0 60 90H80" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="80" cy="90" r="9" fill="#ffffff"/>
  </g>
</svg>
